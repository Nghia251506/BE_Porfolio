services:
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - portfolio-net
    # Không expose ra ngoài host — chỉ nội bộ compose
    # ports:
    #   - "3307:3306"
    deploy:
      resources:
        limits:
          memory: 512M

  be:
    build: .
    container_name: portfolio-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    # Chỉ expose nội bộ cho cloudflared — không mở port ra VPS
    expose:
      - "5000"
    # Debug local trên VPS (optional): bỏ comment dòng dưới
    # ports:
    #   - "5000:5000"
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 768M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - be
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  portfolio_mysql_data:

networks:
  portfolio-net:
    driver: bridge
