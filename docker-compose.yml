services:
  be:
    build: .
    container_name: portfolio-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
      SERVER_PORT: "5000"
    # Thay ENTRYPOINT — luôn bind 0.0.0.0:5000
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar app.jar --server.port=5000 --server.address=0.0.0.0"]
    expose:
      - "5000"
    ports:
      - "5000:5000"
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 768M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - be
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  portfolio-net:
    driver: bridge
