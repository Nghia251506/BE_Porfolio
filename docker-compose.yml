services:
  be:
    build: .
    container_name: portfolio-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
    # Chỉ expose nội bộ cho cloudflared — không mở port ra VPS
    expose:
      - "5000"
    # Debug local trên VPS (optional): bỏ comment dòng dưới
    # ports:
    #   - "5000:5000"
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 768M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - be
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  portfolio-net:
    driver: bridge
